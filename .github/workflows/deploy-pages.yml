name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Gateway, KopKar & Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & Build web-gateway
        env:
          VITE_KOPKARSAI_SYSTEM_URL: ./kopkar/
          VITE_KOPKARSAI_MARKETPLACE_URL: ./marketplace/
        run: |
          pnpm --dir apps/web-gateway install --frozen-lockfile || pnpm --dir apps/web-gateway install
          pnpm --dir apps/web-gateway exec tsc -b
          pnpm --dir apps/web-gateway exec vite build --base=./

      - name: Install & Build web-kopkar
        run: |
          pnpm --dir apps/web-kopkar install --frozen-lockfile || pnpm --dir apps/web-kopkar install
          pnpm --dir apps/web-kopkar exec tsc -b
          pnpm --dir apps/web-kopkar exec vite build --base=./

      - name: Install & Build web-marketplace
        run: |
          pnpm --dir apps/web-marketplace install --frozen-lockfile || pnpm --dir apps/web-marketplace install
          pnpm --dir apps/web-marketplace exec tsc -b
          pnpm --dir apps/web-marketplace exec vite build --base=./

      - name: Assemble GitHub Pages Artifact
        run: |
          rm -rf _site
          mkdir -p _site/kopkar _site/marketplace
          cp -r apps/web-gateway/dist/* _site/
          cp -r apps/web-kopkar/dist/* _site/kopkar/
          cp -r apps/web-marketplace/dist/* _site/marketplace/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
